name: Idea or feature request
description: Something Heystack should do, or do better
labels: ["idea"]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: The problem first, then your idea for it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
